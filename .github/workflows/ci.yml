# Quality gates 1–4 from AGENTS.md. Formatting is advisory, the WCAG display-mode sweep runs separately. Actions are pinned to commit SHAs (supply chain, CRA readiness).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Conventional Commits (commits and PR title)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
      # Values go through env, never interpolated into the script (PR titles are untrusted input).
      - env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/commit-message/commit-msg.ts --range "$BASE_SHA..$HEAD_SHA"
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tooling/commit-message/commit-msg.ts --message "$PR_TITLE"

  gates:
    name: Check, test, i18n, theme
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: '24'
          cache: true
      - run: vp install
      - run: pnpm exec playwright install --with-deps chromium
      # Formatting is advisory: lint and types block, format drift only warns.
      - run: vp check --no-fmt
      - run: vp fmt --check
        continue-on-error: true
      - run: vp run test
      - run: vp run i18n:check
      - run: vp run theme:check
      - run: vp run build
