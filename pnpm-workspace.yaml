packages:
  - apps/*
  - packages/*

catalogMode: strict

catalog:
  # Toolchain. Vite+ is pinned exactly and bundles Vitest, Oxlint, Oxfmt and tsdown.
  vite-plus: 1.8.0
  # The vite alias follows the core version vite-plus pins itself (1.8.0 → 8.3.8001); browser-playwright matches its bundled Vitest.
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
  '@vitest/browser-playwright': 5.1.1
  typescript: ^7.0.2
  '@types/node': ^26.6.6
  # The sanctioned runtime dependencies of core, pinned exactly
  '@tanstack/store': 0.11.3
  '@tanstack/table-core': 9.3.1
  '@tanstack/virtual-core': 3.19.13
  # React 19 only: packages peer on ^19.0.0 (docs/architecture.md)
  react: ^19.3.1
  react-dom: ^19.3.1
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  vitest-browser-react: ^2.3.0
  # Accessibility engine
  axe-core: 4.14.1
  # Approximate screen-reader transcript for tests (plan 0077 Part B): a pinned dev dependency, and an optional peer (~) of @kvirn/testing/read-aloud.
  '@guidepup/virtual-screen-reader': 0.33.0
  # The Vitest browser provider's peer. Vitest runs the browser tests; there is no e2e runner.
  playwright: 1.65.1
  # Tiptap, the rich text editor's engine: peers of @kvirn/rich-text, devDependencies here.
  # One version for every package, pinned exactly, so ProseMirror is never duplicated.
  '@tiptap/core': 3.35.0
  '@tiptap/pm': 3.35.0
  '@tiptap/react': 3.35.0
  '@tiptap/starter-kit': 3.35.0
  '@tiptap/extension-table': 3.35.0
  '@tiptap/extension-image': 3.35.0
  '@tiptap/extensions': 3.35.0
  # Map engine: an optional peer of @kvirn/map's /maplibre entry, a devDependency here. Pinned exactly.
  maplibre-gl: 6.19.0
  # Map engine: an optional peer of @kvirn/map's /leaflet entry (BSD-2-Clause, no install scripts), a devDependency here. Pinned exactly.
  leaflet: 1.9.4
  # Icon libraries: devDependencies only, for Icon's compatibility tests and stories.
  # Pinned exactly, so a release that changes how a library builds its <svg> is a reviewed bump.
  lucide-react: 1.78.0
  '@heroicons/react': 2.2.0
  '@phosphor-icons/react': 2.1.10
  # Workbench, docs, release
  storybook: 10.6.8
  '@storybook/react-vite': 10.6.8
  '@storybook/addon-a11y': 10.6.8
  '@storybook/addon-docs': 10.6.8
  '@storybook/addon-vitest': 10.6.8
  # Tables in MDX pages: a Storybook build dependency only
  remark-gfm: 4.0.1
  next: 16.4.6
  '@changesets/cli': 3.0.3

overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    # storybook declares an optional vite-plus peer that predates 1.0
    - vite-plus
  allowedVersions:
    vite: '*'

# Dependencies allowed to run install scripts (supply-chain review required to add more)
allowBuilds:
  esbuild: true

# One Vitest copy for vite-plus and Storybook (different optional peer sets otherwise split it)
dedupePeers: true
# Added by pnpm on 2026-11-24: vite-plus 1.8.0 (Vitest 5.1.1, the only version that matches @vitest/browser-playwright 5.1.1)
# was published that day, inside the release-age wait. Kept with the maintainer's approval; remove this list on or after 2026-11-26.
minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@8.3.8001'
  - '@voidzero-dev/vite-plus-darwin-arm64@1.8.0'
  - '@voidzero-dev/vite-plus-darwin-x64@1.8.0'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@1.8.0'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@1.8.0'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@1.8.0'
  - '@voidzero-dev/vite-plus-linux-x64-musl@1.8.0'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@1.8.0'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@1.8.0'
  - vite-plus@1.8.0
