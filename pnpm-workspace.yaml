packages:
  - apps/*
  - packages/*

catalogMode: strict

catalog:
  # Toolchain. Vite+ is pinned exactly and bundles Vitest, Oxlint, Oxfmt and tsdown.
  vite-plus: 1.0.0
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  '@vitest/browser-playwright': 5.0.1
  typescript: ^7.0.2
  '@types/node': ^24.19.1
  # The sanctioned runtime dependencies of core, pinned exactly
  '@tanstack/store': 0.11.2
  '@tanstack/table-core': 9.2.6
  '@tanstack/virtual-core': 3.17.11
  # React 19+ only (docs/vision.md)
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  vitest-browser-react: ^2.3.0
  # Accessibility engine
  axe-core: 4.13.0
  # The Vitest browser provider's peer. Vitest runs the browser tests; there is no e2e runner.
  playwright: 1.63.0
  # Tiptap, the rich text editor's engine: peers of @kvirn-ui/rich-text, devDependencies here.
  # One version for every package, pinned exactly, so ProseMirror is never duplicated.
  '@tiptap/core': 3.31.4
  '@tiptap/pm': 3.31.4
  '@tiptap/react': 3.31.4
  '@tiptap/starter-kit': 3.31.4
  '@tiptap/extension-table': 3.31.4
  '@tiptap/extension-image': 3.31.4
  '@tiptap/extensions': 3.31.4
  # Icon libraries: devDependencies only, for Icon's compatibility tests and stories.
  # Pinned exactly, so a release that changes how a library builds its <svg> is a reviewed bump.
  lucide-react: 1.52.0
  '@heroicons/react': 2.2.0
  '@phosphor-icons/react': 2.1.10
  # Workbench, docs, release
  storybook: 10.6.1
  '@storybook/react-vite': 10.6.1
  '@storybook/addon-a11y': 10.6.1
  '@storybook/addon-docs': 10.6.1
  '@storybook/addon-vitest': 10.6.1
  # Tables in MDX pages: a Storybook build dependency only
  remark-gfm: 4.0.1
  next: 16.3.8
  '@changesets/cli': 3.0.3

overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
    # storybook declares an optional vite-plus peer that predates 1.0
    - vite-plus
  allowedVersions:
    vite: '*'

# Dependencies allowed to run install scripts (supply-chain review required to add more)
allowBuilds:
  esbuild: true

# One Vitest copy for vite-plus and Storybook (different optional peer sets otherwise split it)
dedupePeers: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8
